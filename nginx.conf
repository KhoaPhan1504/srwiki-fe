server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes like /dashboard are not real files on
    # disk, so hand any unmatched path to index.html and let React Router
    # resolve it. Without this, refreshing a route returns nginx's own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
